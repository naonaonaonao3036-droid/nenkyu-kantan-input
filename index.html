:root{--bg:#fffaf7;--line:#e7ddd8;--ink:#3e3532;--muted:#84756f;--sel:#fde9e2;--ok:#eaf6ec;--warn:#fff7db}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1180px;margin:auto;padding:8px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top h1{font-size:20px;margin:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;margin-top:6px}.title{font-weight:800;font-size:13px;margin-bottom:5px}
.namegrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}.pick{position:absolute;opacity:0;pointer-events:none}
.btnlabel,.timebtn,.optionbtn{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:8px;min-height:34px;font-weight:700;font-size:12px;cursor:pointer;user-select:none;-webkit-user-select:none;padding:4px}
.namepick:checked+.btnlabel,.pick:checked+.timebtn,.leavepick:checked+.optionbtn,.nenkyuHourPick:checked+.optionbtn{background:var(--sel);border-color:#d9a697}
.sub{display:block;font-size:9px;color:var(--muted);margin-left:3px}.row{display:grid;grid-template-columns:1.25fr 1fr;gap:6px;margin-top:6px}
.timeblock{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timegrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.mingrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:3px}
.leavegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.field label{font-size:11px;color:var(--muted);font-weight:800;display:block;margin:5px 0 3px}
.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 9px;font-size:15px}
.topbtn,.reg{border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:800;height:40px;padding:0 12px}.reg{width:100%;background:var(--sel);border-color:#d9a697;margin-top:6px}
.status{font-size:11px;color:var(--muted);margin-top:4px}.done{display:none;background:var(--ok);border:1px solid #b9d7be;border-radius:10px;padding:12px;margin-top:6px;font-weight:800;font-size:16px}
.done.show{display:block}.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.choicecols{display:grid;grid-template-columns:1.05fr .95fr;gap:6px}
.tripbox{background:#fffdf5}.listitem{border:1px solid var(--line);border-radius:9px;padding:7px;margin-top:5px}.listitem strong{display:block}.itemrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.miniops{display:flex;gap:4px}.minibtn{height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 10px;font-weight:800}.editingbar{display:none;background:#fff3cc;border:1px solid #d6b85e;border-radius:9px;padding:8px;margin-top:6px;font-weight:800}.editingbar.show{display:block}
@media(max-width:900px){.namegrid{grid-template-columns:repeat(8,1fr)}.row,.choicecols,.timeblock{grid-template-columns:1fr}.leavegrid{grid-template-columns:repeat(4,1fr)}.actions{margin-left:0}}
.specialleave{margin-top:8px;padding:8px;border:1px solid #d9e0e6;border-radius:9px;background:#fbfcfd}.specialleave label{display:block;font-size:12px;font-weight:900;margin-bottom:4px}.specialleave input{width:100%;padding:9px;border:1px solid #d9e0e6;border-radius:8px;font:inherit}
.scheduleTargets{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.scheduleTargets label{border:1px solid #d9dfe5;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;background:#fff}
.scheduleTargets input{margin-right:4px}

.checktabs{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.checktab.active{background:#fde9e2;border-color:#d9a697}
.checkrow{display:grid;grid-template-columns:42px 105px 90px 1fr;gap:7px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px;margin-top:5px;background:#fff}
.checkrow.donecheck{background:#eef8f1}
.checkbtn{width:34px;height:34px;border:2px solid #aeb8c0;border-radius:8px;background:#fff;font-size:21px;font-weight:900}
.donecheck .checkbtn{color:#3f7a54;border-color:#3f7a54;background:#fff}
.checkmeta{font-size:11px;color:var(--muted)}
@media(max-width:700px){.checkrow{grid-template-columns:40px 95px 1fr}.checkrow .checkkind{grid-column:2}.checkrow .checkmain{grid-column:2/-1}}
</style>

async function driveFetchAll(){
  if(!DRIVE_API_URL || DRIVE_API_URL.includes('https://script.google.com/macros/s/AKfycbxcnsJ0BlXzV2ZkwXGKG-cw4zvNzjx0IalRHlEWTrC2l8RZLqTE1SpYxPVuR3YzRMJk/exec')) return null;
  const r=await fetch(DRIVE_API_URL+'?action=list',{cache:'no-store'});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'Drive読込失敗');
  return j;
}
function rawLocal(k){
  const aliases=(typeof storageNames==='function')?storageNames(k):[k];
  for(const name of aliases){
    try{
      const a=JSON.parse(localStorage.getItem(name)||'[]');
      if(Array.isArray(a)&&a.length) return a;
    }catch(e){}
  }
  return [];
}
async function driveSyncNow(){
  if(!DRIVE_API_URL || DRIVE_API_URL.includes('https://script.google.com/macros/s/AKfycbxcnsJ0BlXzV2ZkwXGKG-cw4zvNzjx0IalRHlEWTrC2l8RZLqTE1SpYxPVuR3YzRMJk/exec')) return;
  const payload={
    action:'syncAll',
    nenkyuRecords:rawLocal('nenkyuRecords'),
    shucchoRecords:rawLocal('shucchoRecords'),
    yoteiRecords:rawLocal('yoteiRecords')
  };
  const r=await fetch(DRIVE_API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  });
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'Drive保存失敗');
  const e=document.getElementById('driveState');
  if(e)e.textContent='Drive保存：済';
}
function scheduleDriveSync(){
  const e=document.getElementById('driveState');
  if(e)e.textContent='Drive保存：保存中…';
  clearTimeout(driveSyncTimer);
  driveSyncTimer=setTimeout(()=>driveSyncNow().catch(err=>{
    if(e)e.textContent='Drive保存：失敗';
    console.error(err);
  }),350);
}
async function hydrateFromDrive(){
  try{
    const j=await driveFetchAll();
    if(!j)return;
    const sets=[
      ['nenkyuRecords',j.nenkyuRecords||[]],
      ['shucchoRecords',j.shucchoRecords||[]],
      ['yoteiRecords',j.yoteiRecords||[]]
    ];
    sets.forEach(([k,remote])=>{
      if(remote.length){
        const names=(typeof storageNames==='function')?storageNames(k):[k];
        names.forEach(n=>localStorage.setItem(n,JSON.stringify(remote)));
      }
    });
    const e=document.getElementById('driveState');
    if(e)e.textContent='Drive保存：接続済';
  }catch(err){
    const e=document.getElementById('driveState');
    if(e)e.textContent='Drive保存：未接続';
    console.error(err);
  }
}

const STORAGE_ALIASES={
  nenkyuRecords:['teshiro_2026_nenkyuRecords','nenkyuRecords'],
  shucchoRecords:['teshiro_2026_shucchoRecords','shucchoRecords'],
  yoteiRecords:['teshiro_2026_yoteiRecords','yoteiRecords']
};

function storageNames(k){
  return STORAGE_ALIASES[k] || [k];
}

function get(k){
  const names=storageNames(k);
  let merged=[];
  const seen=new Set();

  names.forEach(name=>{
    try{
      const arr=JSON.parse(localStorage.getItem(name)||'[]');
      if(Array.isArray(arr)){
        arr.forEach((r,idx)=>{
          const sig=[
            r.id||'',
            r.date||'',
            r.fullName||r.name||'',
            r.kind||r.purpose||r.title||'',
            r.amount||'',
            r.start||'',
            r.end||'',
            r.updatedAt||r.createdAt||'',
            idx
          ].join('|');
          if(!seen.has(sig)){
            seen.add(sig);
            merged.push(r);
          }
        });
      }
    }catch(e){}
  });

  // One-time migration: write merged data back to every compatible key.
  try{
    names.forEach(name=>localStorage.setItem(name,JSON.stringify(merged)));
  }catch(e){}

  return merged;
}

function set(k,v){
  try{
    const names=storageNames(k);
    const data=JSON.stringify(v);

    // Main copies
    names.forEach(name=>localStorage.setItem(name,data));

    // Rolling backup copies. These survive future code changes as long as browser data remains.
    const stamp=new Date().toISOString().slice(0,10);
    localStorage.setItem('backup_'+k+'_latest',data);
    localStorage.setItem('backup_'+k+'_'+stamp,data);

    scheduleDriveSync();
    return true;
  }catch(e){
    showDone('保存できませんでした');
    return false;
  }
}

function restoreLatestBackups(){
  ['nenkyuRecords','shucchoRecords','yoteiRecords'].forEach(k=>{
    const current=get(k);
    if(current.length)return;
    try{
      const b=JSON.parse(localStorage.getItem('backup_'+k+'_latest')||'[]');
      if(Array.isArray(b)&&b.length){
        set(k,b);
      }
    }catch(e){}
  });
}

function jp(h,m){return h+'：'+String(m).padStart(2,'0')}
const STORE_PREFIX='teshiro_2026_';
function storageAvailable(){
  try{
    const k='__storage_test__';
    localStorage.setItem(k,'1');
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function get(key){
  try{
    // New key first, then legacy key for compatibility with yesterday's data.
    let raw=localStorage.getItem(STORE_PREFIX+key);
    if(!raw) raw=localStorage.getItem(key);
    if(!raw) return [];
    const v=JSON.parse(raw);
    return Array.isArray(v)?v:[];
  }catch(e){
    console.error('read error',e);
    return [];
  }
}
function set(key,v){
  try{
    if(!storageAvailable()) throw new Error('この開き方ではブラウザ保存が使えません');
    const raw=JSON.stringify(v);
    localStorage.setItem(STORE_PREFIX+key,raw);
    localStorage.setItem(key,raw); // keep yesterday's key too
    const check=localStorage.getItem(STORE_PREFIX+key);
    if(check!==raw) throw new Error('保存確認に失敗しました');
    scheduleDriveSync();
    return true;
  }catch(e){
    $('portalSync').textContent='保存できません：'+e.message;
    $('portalSync').style.color='#b55757';
    console.error('write error',e);
    return false;
  }
}

function selectedScheduleTargets(){
  const checks=[...document.querySelectorAll('#scheduleTargets input[type="checkbox"]')];
  return checks.filter(x=>x.checked).map(x=>x.value);
}
(function(){
  const checks=[...document.querySelectorAll('#scheduleTargets input[type="checkbox"]')];
  checks.forEach(cb=>cb.addEventListener('change',()=>{
    if(cb.value==='全員' && cb.checked){
      checks.forEach(x=>{if(x!==cb)x.checked=false});
    }else if(cb.checked){
      const all=checks.find(x=>x.value==='全員'); if(all) all.checked=false;
    }
    if(!checks.some(x=>x.checked)){
      const all=checks.find(x=>x.value==='全員'); if(all) all.checked=true;
    }
  }));
})();

$('scheduleReg').onclick=()=>{
  const title=$('scheduleTitle').value.trim();
  if(!title){showDone('予定名を入力してください');return}
  const targets=selectedScheduleTargets();
  const individuals=targets.includes('個人') ? checkedNames() : [];
  if(targets.includes('個人') && !individuals.length){showDone('個人を選んだ場合は、上の名前も選んでください');return}
  const t=hasCompleteTime()?timeData():null;
  if(t && t.eh*60+t.em<=t.sh*60+t.sm){showDone('終了時刻を確認してください');return}
  const rows=get('yoteiRecords');
  const rec={
    date:$('date').value,
    title,
    place:$('schedulePlace').value.trim(),
    targets,
    people:individuals.map(x=>x.full),
    display:$('scheduleDisplay').value,
    note:$('scheduleNote').value.trim(),
    start:t?jp(t.sh,t.sm):'',
    end:t?jp(t.eh,t.em):'',
    status:'active',
    updatedAt:new Date().toISOString()
  };
  if(scheduleEditIndex!==null){
    rows[scheduleEditIndex]={...(rows[scheduleEditIndex]||{}),...rec};
    if(!set('yoteiRecords',rows)) return;
    scheduleEditIndex=null;
    $('scheduleReg').textContent='予定を登録';
    $('scheduleEditing').textContent='';
    $('scheduleEditing').classList.remove('show');
    showDone('予定を修正しました：'+title);
  }else{
    rows.push(rec);
    if(!set('yoteiRecords',rows)) return;
    showDone('予定を登録しました：'+title);
  }
  $('scheduleTitle').value='';$('schedulePlace').value='';$('scheduleNote').value='';
  renderRecent();
};

  const rows=get('yoteiRecords'),r=rows[index]; if(!r)return;
  scheduleEditIndex=index;
  $('date').value=r.date||$('date').value;
  $('scheduleTitle').value=r.title||'';
  $('schedulePlace').value=r.place||'';
  $('scheduleDisplay').value=r.display||'ポータル';
  $('scheduleNote').value=r.note||'';
  const checks=[...document.querySelectorAll('#scheduleTargets input[type="checkbox"]')];
  checks.forEach(x=>x.checked=(r.targets||[]).includes(x.value));
  document.querySelectorAll('.namepick').forEach(x=>x.checked=false);
  (r.people||[]).forEach(full=>{
    const idx=staff.findIndex(p=>p.join(' ')===full);
    if(idx>=0){const n=$('n'+idx);if(n)n.checked=true;}
  });
  if(r.start&&r.end){
    const st=parseTime(r.start),et=parseTime(r.end);
    setRadio('startHour',st.h);setRadio('startMinute',st.m);
    setRadio('endHour',et.h);setRadio('endMinute',et.m);
  }else clearTimeSelection();
  $('scheduleReg').textContent='この予定を更新';
  $('scheduleEditing').textContent='修正中：'+(r.date||'')+'　'+(r.title||'');
  $('scheduleEditing').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}
function rememberDeleted(source,index,record){
  try{localStorage.setItem('teshiro_last_deleted',JSON.stringify({source,index,record,at:new Date().toISOString()}));}catch(e){}
}
function undoLastDelete(){
  let x=null;
  try{x=JSON.parse(localStorage.getItem('teshiro_last_deleted')||'null');}catch(e){}
  if(!x||!x.source||!x.record){showDone('戻せる削除はありません');return;}
  const rows=get(x.source);
  let idx=Number(x.index);
  if(!Number.isInteger(idx)||idx<0||idx>=rows.length) idx=rows.findIndex(r=>r&&r.id&&x.record.id&&r.id===x.record.id);
  if(idx<0){showDone('削除したデータを見つけられませんでした');return;}
  rows[idx]={...x.record,status:'active',updatedAt:new Date().toISOString()};
  if(!set(x.source,rows))return;
  try{localStorage.removeItem('teshiro_last_deleted');}catch(e){}
  showDone('直前に削除したデータを戻しました');
}
if($('undoDeleteBtn')) $('undoDeleteBtn').onclick=undoLastDelete;

function cancelSchedule(index){
  const rows=get('yoteiRecords'),r=rows[index];if(!r)return;
  if(!confirm('この予定を削除しますか？'))return;
  rememberDeleted('yoteiRecords',index,{...r});
  rows[index]={...r,status:'cancelled',updatedAt:new Date().toISOString()};
  if(!set('yoteiRecords',rows))return;
  showDone('予定を削除しました');
  renderRecent();
}


let checkTab='date';
function allActiveRecords(){
 const leaves=get('nenkyuRecords').map((r,i)=>({type:'休暇',source:'nenkyuRecords',i,r})).filter(x=>x.r.status!=='cancelled');
 const trips=get('shucchoRecords').map((r,i)=>({type:'出張',source:'shucchoRecords',i,r})).filter(x=>x.r.status!=='cancelled');
 const plans=get('yoteiRecords').map((r,i)=>({type:'予定',source:'yoteiRecords',i,r})).filter(x=>x.r.status!=='cancelled');
 return [...leaves,...trips,...plans];
}
function recName(x){
 const r=x.r;
 if(x.type==='予定') return (r.targets||[]).join('・')||'全員';
 return r.fullName||r.name||'';
}
function recTitle(x){
 const r=x.r;
 if(x.type==='休暇') return r.label||r.diary||r.kind||'休暇';
 if(x.type==='出張') return (r.purpose||'')+(r.venue?('／'+r.venue):'');
 return (r.title||'')+(r.place?('／'+r.place):'');
}
function recTime(x){
 const r=x.r;
 return [r.start,r.end].filter(Boolean).join('〜');
}
function renderCheckList(){
 let arr=allActiveRecords();
 if(checkTab==='unchecked') arr=arr.filter(x=>!x.r.checked);
 if(checkTab==='checked') arr=arr.filter(x=>!!x.r.checked);
 arr.sort((a,b)=>{
   if(checkTab==='name') return recName(a).localeCompare(recName(b),'ja') || String(a.r.date||'').localeCompare(String(b.r.date||''));
   if(checkTab==='kind') return a.type.localeCompare(b.type,'ja') || String(a.r.date||'').localeCompare(String(b.r.date||''));
   return String(a.r.date||'').localeCompare(String(b.r.date||'')) || recName(a).localeCompare(recName(b),'ja');
 });
 const total=allActiveRecords();
 $('checkSummary').textContent='全 '+total.length+'件　／　未確認 '+total.filter(x=>!x.r.checked).length+'件　／　確認済 '+total.filter(x=>x.r.checked).length+'件';
 $('checkList').innerHTML=arr.length?arr.map(x=>{
   const r=x.r, done=!!r.checked;
   return '<div class="checkrow '+(done?'donecheck':'')+'">'+
     '<button type="button" class="checkbtn" data-source="'+x.source+'" data-i="'+x.i+'">'+(done?'✓':'')+'</button>'+
     '<div><strong>'+(r.date||'')+'</strong><div class="checkmeta">'+recTime(x)+'</div></div>'+
     '<div class="checkkind"><strong>'+x.type+'</strong></div>'+
     '<div class="checkmain"><strong>'+recName(x)+'</strong>　'+recTitle(x)+'</div>'+
   '</div>';
 }).join(''):'<div class="status">該当するデータはありません。</div>';
 document.querySelectorAll('.checkbtn').forEach(b=>b.onclick=()=>{
   const rows=get(b.dataset.source),i=Number(b.dataset.i);
   if(!rows[i])return;
   rows[i]={...rows[i],checked:!rows[i].checked,checkedAt:new Date().toISOString()};
   if(set(b.dataset.source,rows)){renderCheckList();renderRecent();}
 });
}
document.querySelectorAll('.checktab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.checktab').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');checkTab=b.dataset.checktab;renderCheckList();
});

function renderRecent(){
 const leaves=get('nenkyuRecords').filter(r=>r.status!=='cancelled').map((r,i)=>({
   type:'休暇',date:r.date,name:r.fullName||r.name,text:r.label||r.diary||r.kind||'年休',
   time:(r.start||'')+'〜'+(r.end||''),sourceIndex:i
 }));
 const tripRows=get('shucchoRecords');
 const trips=tripRows.map((r,i)=>({r,i})).filter(x=>x.r.status!=='cancelled').map(x=>({
   type:'出張',date:x.r.date,name:x.r.fullName||x.r.name,text:(x.r.purpose||'')+'／'+(x.r.venue||''),
   time:(x.r.start||'')+'〜'+(x.r.end||''),sourceIndex:x.i
 }));
 const scheduleRows=get('yoteiRecords');
 const schedules=scheduleRows.map((r,i)=>({r,i})).filter(x=>x.r.status!=='cancelled').map(x=>({
   type:'予定',date:x.r.date,name:(x.r.targets||[]).join('・')||'全員',
   text:(x.r.title||'')+(x.r.place?('／'+x.r.place):''),
   time:(x.r.start||'')+(x.r.start||x.r.end?'〜':'')+(x.r.end||''),sourceIndex:x.i
 }));
 const all=[...leaves,...trips,...schedules].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,16);

 if(!all.length){$('recent').innerHTML='まだ登録はありません。';return}

 $('recent').innerHTML=all.map(r=>{
   const ops=r.type==='出張'
     ? '<div class="miniops"><button type="button" class="minibtn editTrip" data-i="'+r.sourceIndex+'">修正</button><button type="button" class="minibtn cancelTrip" data-i="'+r.sourceIndex+'">削除</button></div>'
     : (r.type==='予定'
       ? '<div class="miniops"><button type="button" class="minibtn editSchedule" data-i="'+r.sourceIndex+'">修正</button><button type="button" class="minibtn cancelSchedule" data-i="'+r.sourceIndex+'">削除</button></div>'
       : '<div class="miniops"><button type="button" class="minibtn editLeave" data-i="'+r.sourceIndex+'">修正</button><button type="button" class="minibtn cancelLeave" data-i="'+r.sourceIndex+'">削除</button></div>');
   return '<div class="listitem"><div class="itemrow"><div><strong>'+r.type+'　'+r.date+'　'+r.name+'</strong>'+r.text+'　'+r.time+'</div>'+ops+'</div></div>';
 }).join('');

 document.querySelectorAll('.editLeave').forEach(btn=>btn.onclick=()=>loadLeaveEdit(Number(btn.dataset.i)));
 document.querySelectorAll('.cancelLeave').forEach(btn=>btn.onclick=()=>cancelLeave(Number(btn.dataset.i)));
 document.querySelectorAll('.editSchedule').forEach(btn=>btn.onclick=()=>loadScheduleEdit(Number(btn.dataset.i)));
 document.querySelectorAll('.cancelSchedule').forEach(btn=>btn.onclick=()=>cancelSchedule(Number(btn.dataset.i)));
 document.querySelectorAll('.editTrip').forEach(btn=>btn.onclick=()=>loadTripEdit(Number(btn.dataset.i)));
 document.querySelectorAll('.cancelTrip').forEach(btn=>btn.onclick=()=>cancelTrip(Number(btn.dataset.i)));
}

function setRadio(name,value){
 const el=document.querySelector('input[name="'+name+'"][value="'+value+'"]');
 if(el) el.checked=true;
}
function parseTime(t){
 const a=String(t||'').replace('：',':').split(':').map(Number);
 return {h:a[0]||0,m:a[1]||0};
}

function selectLeaveRadio(r){
 let pick=null;
 if(r.kind==='特休')pick=document.querySelector('.leavepick[data-kind="特休"]');
 else if(r.kind==='年休'){
  pick=document.querySelector('.leavepick[data-kind="年休"]');if(pick)pick.checked=true;updateSpecialLeaveBox();
  const h=r.oneDay||r.unit==='day'?'1day':String(r.hours||r.amount||'');
  const hp=[...document.querySelectorAll('.nenkyuHourPick')].find(x=>x.dataset.hours===h);if(hp)hp.checked=true;return;
 }else pick=[...document.querySelectorAll('.leavepick')].find(x=>x.dataset.label===(r.label||'')||x.dataset.kind===(r.kind||''));
 if(pick)pick.checked=true;updateSpecialLeaveBox();
 if(r.kind==='特休')$('specialLeaveNo').value=r.specialLeaveNo||(String(r.label||'').match(/（(.+?)）/)||[])[1]||'';
}
function loadLeaveEdit(index){
 const rows=get('nenkyuRecords'),r=rows[index];if(!r)return;leaveEditIndex=index;
 const same=(x)=>x && x.status!=='cancelled' && x.date===r.date && x.kind===r.kind && String(x.amount||'')===String(r.amount||'') && String(x.start||'')===String(r.start||'') && String(x.end||'')===String(r.end||'') && String(x.label||'')===String(r.label||'');
 leaveEditIndices=r.batchId ? rows.map((x,i)=>x&&x.batchId===r.batchId&&x.status!=='cancelled'?i:-1).filter(i=>i>=0) : rows.map((x,i)=>same(x)?i:-1).filter(i=>i>=0);
 if(!leaveEditIndices.length)leaveEditIndices=[index];
 document.querySelectorAll('.namepick').forEach(x=>x.checked=false);
 leaveEditIndices.forEach(i=>{const rr=rows[i];let si=staff.findIndex(p=>p.join(' ')===(rr.fullName||''));if(si<0)si=staff.findIndex(p=>p[0]===rr.name);if(si>=0){const n=$('n'+si);if(n)n.checked=true;}});
 $('date').value=r.date||$('date').value;const st=parseTime(r.start),et=parseTime(r.end);setRadio('startHour',st.h);setRadio('startMinute',st.m);setRadio('endHour',et.h);setRadio('endMinute',et.m);selectLeaveRadio(r);
 const durVal=(r.oneDay||r.unit==='day')?'1day':String(r.hours||r.amount||'');
 const dp=[...document.querySelectorAll('.leaveDurationPick')].find(x=>x.dataset.hours===durVal);
 if(dp) dp.checked=true;
 if(r.oneDay||r.unit==='day') clearTimeSelection();
 $('leaveReg').textContent=leaveEditIndices.length+'人分の休暇をまとめて修正保存';$('leaveEditing').textContent='まとめて修正中：'+leaveEditIndices.length+'人　'+(r.date||'')+'　'+(r.label||r.kind||'');$('leaveEditing').classList.add('show');window.scrollTo({top:0,behavior:'smooth'});
}
function cancelLeave(index){
 const rows=get('nenkyuRecords'),r=rows[index];if(!r)return;if(!confirm('この休暇登録を削除しますか？'))return;rememberDeleted('nenkyuRecords',index,{...r});rows[index]={...r,status:'cancelled',updatedAt:new Date().toISOString()};if(!set('nenkyuRecords',rows))return;if(leaveEditIndices.includes(index)||leaveEditIndex===index){leaveEditIndex=null;leaveEditIndices=[];$('leaveReg').textContent='年休・休暇を登録';$('leaveEditing').classList.remove('show');$('leaveEditing').textContent='';}showDone('休暇登録を削除しました');
}

function loadTripEdit(index){
 const rows=get('shucchoRecords'),r=rows[index];if(!r)return;
 tripEditIndex=index;
 const same=(x)=>x && x.status!=='cancelled' && x.date===r.date && String(x.purpose||'')===String(r.purpose||'') && String(x.venue||'')===String(r.venue||'') && String(x.start||'')===String(r.start||'') && String(x.end||'')===String(r.end||'');
 tripEditIndices=r.batchId ? rows.map((x,i)=>x&&x.batchId===r.batchId&&x.status!=='cancelled'?i:-1).filter(i=>i>=0) : rows.map((x,i)=>same(x)?i:-1).filter(i=>i>=0);
 if(!tripEditIndices.length)tripEditIndices=[index];
 document.querySelectorAll('.namepick').forEach(x=>x.checked=false);
 tripEditIndices.forEach(i=>{const rr=rows[i];let si=staff.findIndex(p=>p.join(' ')===(rr.fullName||''));if(si<0)si=staff.findIndex(p=>p[0]===rr.name);if(si>=0){const n=$('n'+si);if(n)n.checked=true;}});
 $('date').value=r.date||$('date').value;
 $('purpose').value=r.purpose||'';
 $('venue').value=r.venue||'';
 const st=parseTime(r.start),et=parseTime(r.end);
 setRadio('startHour',st.h);setRadio('startMinute',st.m);
 setRadio('endHour',et.h);setRadio('endMinute',et.m);
 $('tripReg').textContent=tripEditIndices.length+'人分の出張をまとめて更新';
 $('tripEditing').textContent='まとめて修正中：'+tripEditIndices.length+'人　'+(r.date||'')+'　'+(r.purpose||'')+'／'+(r.venue||'');
 $('tripEditing').classList.add('show');
 window.scrollTo({top:0,behavior:'smooth'});
}
function cancelTrip(index){
 const rows=get('shucchoRecords'),r=rows[index];if(!r)return;
 if(!confirm((r.date||'')+' '+(r.fullName||r.name||'')+' の出張登録を削除しますか？'))return;
 rememberDeleted('shucchoRecords',index,{...r});
 r.status='cancelled';r.cancelledAt=new Date().toISOString();rows[index]=r;set('shucchoRecords',rows);
 if(tripEditIndices.includes(index)||tripEditIndex===index){
   tripEditIndex=null;tripEditIndices=[];$('tripReg').textContent='出張を登録';$('tripEditing').classList.remove('show');$('tripEditing').textContent='';
 }
 showDone('出張登録を削除しました');
}

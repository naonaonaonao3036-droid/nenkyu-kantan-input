<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>手城小 かんたん入力</title>

<style>
:root{
  --bg:#fffaf7;
  --line:#e5d8d2;
  --pink:#fde9e2;
  --accent:#d79d88;
  --ink:#3d3532;
}
*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

.wrap{
  max-width:820px;
  margin:auto;
  padding:10px 10px 80px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  position:sticky;
  top:0;
  background:var(--bg);
  padding:5px 0;
  z-index:10;
}

.menu button{
  height:56px;
  border:2px solid var(--line);
  border-radius:12px;
  background:white;
  font-size:18px;
  font-weight:bold;
}

.menu button.active{
  background:var(--pink);
  border-color:var(--accent);
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin-top:8px;
}

.hidden{display:none!important}

.title{
  font-weight:bold;
  margin-bottom:7px;
}

.search{
  display:grid;
  grid-template-columns:1fr auto;
  gap:6px;
}

input,textarea{
  width:100%;
  min-height:46px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:8px 10px;
  font-size:17px;
  background:white;
}

textarea{
  min-height:75px;
}

.small{
  min-height:44px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
  padding:0 12px;
  font-weight:bold;
}

.names,.opts{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-top:7px;
}

.name,.opt{
  min-height:42px;
  border:1px solid #ddd;
  border-radius:9px;
  background:white;
  font-weight:bold;
}

.sel{
  background:var(--pink)!important;
  border:2px solid var(--accent)!important;
}

.calhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.cal{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-top:6px;
}

.dow{
  text-align:center;
  font-size:11px;
  font-weight:bold;
}

.day{
  height:42px;
  border:1px solid #ddd;
  border-radius:9px;
  background:white;
  font-weight:bold;
}

.blank{visibility:hidden}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:6px;
}

.chip{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  background:var(--pink);
  font-size:12px;
  font-weight:bold;
}

.field{
  margin-top:8px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:4px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.review{
  background:#fff6f1;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  line-height:1.6;
  font-weight:bold;
}

.register{
  width:100%;
  min-height:56px;
  margin-top:8px;
  border:2px solid var(--accent);
  border-radius:12px;
  background:var(--pink);
  font-size:18px;
  font-weight:bold;
}

.note{
  font-size:12px;
  color:#786d68;
  margin-top:5px;
}

@media(max-width:650px){
  .names,.opts{
    grid-template-columns:repeat(4,1fr);
  }
  .two{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>
<div class="wrap">

<div class="menu">
  <button data-mode="leave">① 休暇</button>
  <button data-mode="trip">② 出張</button>
  <button data-mode="plan">③ 予定</button>
</div>

<div id="start" class="card">
  <div class="title">入力するものを選んでください</div>
  上の「休暇・出張・予定」を押してください。
</div>

<div id="dateCard" class="card hidden">
  <div class="title">日付（複数日はそのままタップ）</div>

  <div class="calhead">
    <button id="prev" class="small">◀</button>
    <strong id="month"></strong>
    <button id="next" class="small">▶</button>
  </div>

  <div id="calendar" class="cal"></div>
  <div id="dateChips" class="chips"></div>
</div>

<div id="nameCard" class="card hidden">
  <div class="title">名前</div>

  <div class="search">
    <input id="nameSearch"
           placeholder="例：せ → 瀬尾　わ → 和田">
    <button id="clearName" class="small">クリア</button>
  </div>

  <div id="nameResults" class="names"></div>
  <div id="nameChips" class="chips"></div>

  <div class="note">
    わ → 和田（校長）・和田亜　
    い → 井上真・井上日・池田・石原　
    ふ → 藤江・藤田・藤本・藤井
  </div>
</div>

<div id="timeCard" class="card hidden">
  <div class="title">時刻（必要なときだけ）</div>

  <div class="two">
    <div class="field">
      <label>開始</label>
      <input id="startTime" type="time">
    </div>

    <div class="field">
      <label>終了</label>
      <input id="endTime" type="time">
    </div>
  </div>
</div>

<div id="leaveCard" class="card hidden">
  <div class="title">休暇入力</div>

  <div id="leaveKinds" class="opts"></div>

  <div id="specialNoBox" class="field hidden">
    <label>特休は何号？</label>
    <input id="specialNo"
           placeholder="例：7号">
  </div>

  <div class="field">
    <label>取得時間</label>
  </div>

  <div id="amounts" class="opts"></div>
</div>

<div id="tripCard" class="card hidden">
  <div class="title">出張入力</div>

  <div class="field">
    <label>用務</label>
    <textarea id="purpose"
              placeholder="例：市内一斉研修"></textarea>
  </div>

  <div class="field">
    <label>会場</label>
    <input id="venue"
           placeholder="例：緑丘小学校">
  </div>
</div>

<div id="planCard" class="card hidden">
  <div class="title">予定入力</div>

  <div class="field">
    <label>予定</label>
    <textarea id="planTitle"
              placeholder="例：読み聞かせ"></textarea>
  </div>

  <div class="field">
    <label>対象</label>
    <input id="planTarget"
           placeholder="例：1年・6年・ひま">
  </div>

  <div class="field">
    <label>場所</label>
    <input id="planPlace"
           placeholder="場所">
  </div>
</div>

<div id="reviewCard" class="card hidden">
  <div class="title">登録前の確認</div>
  <div id="review" class="review">
    入力するとここに表示します。
  </div>

  <button id="register"
          class="register">
    登録
  </button>
</div>

</div>
